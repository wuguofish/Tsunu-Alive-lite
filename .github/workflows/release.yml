name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先建好唯一一份草稿 release，各平台的打包 job 都上傳到同一份。
  # 不這樣做的話，各 job 會同時各建一份，結果出現重複的 release。
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases"             -f tag_name="$GITHUB_REF_NAME" -f name="Tsunu Alive Lite $GITHUB_REF_NAME" -F draft=true             -f body="$(cat <<'NOTES'
          ## Tsunu Alive Lite

          輕量版 — xterm.js + Claude CLI 原生體驗

          ### 前提條件
          請先安裝 [Claude Code CLI](https://docs.anthropic.com/en/docs/claude-code/overview)。

          ### Windows
          - 下載 `.exe` (NSIS 安裝檔) 或 `.msi` (MSI 安裝檔)

          ### macOS
          - 下載 `.dmg` 並拖到應用程式資料夾

          ### Linux
          - 下載 `.AppImage`、`.deb` 或 `.rpm`
          NOTES
          )" --jq '"release_id=\(.id)"' >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    # 手動執行時沒有 create-release（被略過），打包照樣進行。
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-15
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # 從 tag 同步版本號到三個檔案
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # tauri.conf.json
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

          # package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Cargo.toml（用 node 替換，避免 macOS/Linux sed -i 差異）
          node -e "
            const fs = require('fs');
            let toml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            toml = toml.replace(/^version = \".*\"/m, 'version = \"$VERSION\"');
            fs.writeFileSync('src-tauri/Cargo.toml', toml);
          "

          echo "Version synced to: $VERSION"

      # 建置 Tauri App：推 v* tag 時上傳到 create-release 建好的草稿；手動執行只打包，安裝檔放在這次 run 的 artifacts。
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ""
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadWorkflowArtifacts: true
          # tauri-action v1 預設 releaseDraft 是 false，會把上傳到的 release 直接發佈；明寫成草稿，發佈留給人按。
          releaseDraft: true
          args: --target ${{ matrix.target }}
